<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Office Desk Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: the floor plan is a drafting sheet on the left; the desk/person ledger sits on the right. Stacks on phones. */
:root{
  --paper:#eceff0; --sheet:#f7f9f9; --surface:#ffffff; --ink:#1a2529; --muted:#5b6a6f;
  --line:#d3dbdd; --line-strong:#9aa8ad; --grid:#e2e8ea; --grid-major:#d2dadd;
  --accent:#2453a6; --accent-ink:#ffffff; --accent-soft:#e3ebf8;
  --danger:#b23a2e; --danger-soft:#fbe9e6; --ok:#2c7650; --ok-soft:#e2f2e9; --warn:#8a5a00; --warn-soft:#fbf1dc;
  --shadow:rgba(20,35,45,.16); --scrim:rgba(18,26,30,.45);
  --t0:#c4561c; --t1:#2c7a4e; --t2:#7a49b3; --t3:#0e7b8a; --t4:#b52f6b; --t5:#8c6a0f; --t6:#3a5fc6; --t7:#5f7322;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111719; --sheet:#161e21; --surface:#1d272b; --ink:#e4ecee; --muted:#9aabb0;
    --line:#2e3b40; --line-strong:#5d6f75; --grid:#1d272a; --grid-major:#263337;
    --accent:#7da4ec; --accent-ink:#0d1a30; --accent-soft:#1f2c44;
    --danger:#ee8577; --danger-soft:#3a201c; --ok:#6fcf9c; --ok-soft:#18302a; --warn:#e9b65a; --warn-soft:#33281a;
    --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6);
    --t0:#f08c52; --t1:#5fc48c; --t2:#b48ae8; --t3:#4cc2d0; --t4:#ec72a8; --t5:#d8b24b; --t6:#88a6f3; --t7:#a8bd5c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111719; --sheet:#161e21; --surface:#1d272b; --ink:#e4ecee; --muted:#9aabb0;
  --line:#2e3b40; --line-strong:#5d6f75; --grid:#1d272a; --grid-major:#263337;
  --accent:#7da4ec; --accent-ink:#0d1a30; --accent-soft:#1f2c44;
  --danger:#ee8577; --danger-soft:#3a201c; --ok:#6fcf9c; --ok-soft:#18302a; --warn:#e9b65a; --warn-soft:#33281a;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6);
  --t0:#f08c52; --t1:#5fc48c; --t2:#b48ae8; --t3:#4cc2d0; --t4:#ec72a8; --t5:#d8b24b; --t6:#88a6f3; --t7:#a8bd5c;
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100%;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 16px;gap:12px}

/* Header */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px 0}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 12px}
.stats b{color:var(--ink);font-weight:600}
.stats .warn b{color:var(--warn)}
.savechip{align-self:flex-start;margin-top:4px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:11px;color:var(--ok);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savechip.warn{color:var(--warn);border-color:color-mix(in srgb, var(--warn) 40%, var(--line))}
.search{position:relative;flex:1 1 260px;max-width:380px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--line-strong)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 40%, var(--line))}
.btn.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Notices */
.notices{display:flex;flex-direction:column;gap:8px;min-width:0}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:14px;border:1px solid color-mix(in srgb, var(--warn) 25%, transparent)}
.notice p{margin:0;flex:1 1 280px;min-width:0}
.notice .row{display:flex;gap:8px;flex-wrap:wrap}

/* Work area */
.work{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;min-height:0}
.sheet{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.tools .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tools .hint{color:var(--muted);font-size:14px}
.tools .sep{width:1px;height:24px;background:var(--line)}
.tools .spacer{flex:1}
.zoom{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.zoom button{border:0;background:transparent;min-width:32px;height:32px;cursor:pointer;font-size:18px;font-weight:600;border-radius:7px;padding:0 6px}
.zoom button.fit{font-size:13px;border-left:1px solid var(--line);border-radius:0 7px 7px 0;padding:0 10px}
.zoom button:hover{background:var(--accent-soft)}
.zoom span{font-family:var(--f-mono);font-size:12px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.confirmbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;padding-top:4px;font-size:14px}

.scroll{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain}
.plan{position:relative;--u:22px;margin:calc(var(--u)*.5);
  background-color:var(--sheet);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:calc(var(--u)*4) calc(var(--u)*4),calc(var(--u)*4) calc(var(--u)*4),var(--u) var(--u),var(--u) var(--u);
  border:1px solid var(--line)}
.plan.tiny{background-image:linear-gradient(var(--grid-major) 1px, transparent 1px),linear-gradient(90deg, var(--grid-major) 1px, transparent 1px);background-size:calc(var(--u)*4) calc(var(--u)*4)}
.plan.arrange{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.plan-msg{position:absolute;left:16px;top:16px;width:min(460px, calc(100vw - 80px));padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:10px;z-index:4}
.plan-msg h2{font-family:var(--f-display);font-size:22px;margin:0}
.plan-msg p{margin:0;color:var(--muted)}

/* Areas */
/* each area is drawn twice: its tint sits under the desks, its outline, name and resize handle sit over them */
.zone,.zone-top{position:absolute;left:calc(var(--x)*var(--u));top:calc(var(--y)*var(--u));width:calc(var(--w)*var(--u));height:calc(var(--h)*var(--u));border-radius:6px;pointer-events:none}
.zone{background:color-mix(in srgb, var(--accent) 5%, transparent);z-index:0}
.zone.selected{background:color-mix(in srgb, var(--accent) 10%, transparent)}
.zone-top{border:1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent);z-index:4}
.zone-top.selected{border-style:solid;border-color:var(--accent);z-index:5}
.zlabel{position:absolute;left:calc(var(--u)*.5);top:0;transform:translateY(-50%);padding:0 6px;background:var(--sheet);border:0;border-radius:4px;
  font-family:var(--f-display);font-weight:700;font-size:max(11px, calc(var(--u)*.6));letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap;line-height:1.3;pointer-events:none;max-width:calc(100% - var(--u))}
.plan.arrange .zlabel{pointer-events:auto;cursor:move;touch-action:none;outline:1px dashed color-mix(in srgb, var(--accent) 50%, transparent)}
.zhandle{position:absolute;right:-11px;bottom:-11px;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--sheet);box-shadow:0 1px 4px var(--shadow);pointer-events:auto;cursor:nwse-resize;touch-action:none}
.zhandle::after{content:"";position:absolute;inset:-8px}

/* Desks */
.desk{position:absolute;left:calc(var(--x)*var(--u));top:calc(var(--y)*var(--u));width:calc(var(--w)*var(--u));height:calc(var(--h)*var(--u));
  cursor:pointer;--tc:var(--line-strong);-webkit-tap-highlight-color:transparent;outline:none;z-index:1}
.desk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.desk .shape{fill:color-mix(in srgb, var(--tc) 17%, var(--surface));stroke:var(--tc);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .15s}
.desk.free .shape{fill:var(--surface);stroke:var(--line-strong);stroke-dasharray:4 3}
.desk:hover .shape{fill:color-mix(in srgb, var(--tc) 28%, var(--surface))}
.desk.free:hover .shape{fill:var(--accent-soft)}
.desk.selected{z-index:3}
.desk.selected .shape{stroke:var(--accent);stroke-width:2.75;stroke-dasharray:none;fill:color-mix(in srgb, var(--accent) 16%, var(--surface))}
.desk.selected.single .shape{stroke:var(--ink);fill:color-mix(in srgb, var(--tc) 17%, var(--surface))}
.desk.selected.single.free .shape{fill:var(--surface)}
.desk.selected.single svg{filter:drop-shadow(0 3px 6px var(--shadow))}
.desk:focus-visible .shape{stroke:var(--accent);stroke-width:3}
.plan.searching .desk:not(.hit){opacity:.25}
.plan.searching .desk.hit .shape{stroke:var(--accent);stroke-width:2.5}
.plan.arrange .desk{cursor:grab;touch-action:none}
.desk.dragging{z-index:6;cursor:grabbing;opacity:.92}
.desk.blocked .shape{stroke:var(--danger);fill:var(--danger-soft)}
.desk.ghost{pointer-events:none}
.desk.ghost.off{display:none}
.tools [data-act="addDesk"]{cursor:grab;touch-action:none}
body.placing, body.placing *{cursor:grabbing !important}
.lbl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 calc(var(--u)*.3);overflow:hidden;pointer-events:none;line-height:1.1;user-select:none;-webkit-user-select:none}
.lbl.top{bottom:50%}
.lbl.bottom{top:50%}
.lbl.vert{writing-mode:vertical-rl;transform:rotate(180deg);padding:calc(var(--u)*.3) 0;align-items:center}
.lbl .num{font-family:var(--f-mono);font-weight:600;font-size:max(8px, calc(var(--u)*.44));color:var(--muted);letter-spacing:.02em}
.lbl .nm{font-weight:600;font-size:max(9px, calc(var(--u)*.56));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.desk.free .lbl .nm{color:var(--muted);font-weight:500;font-style:italic}
/* zoomed out: names give way so the desk number always stays readable */
.plan.small .lbl .nm,.plan.tiny .lbl .nm{display:none}
.plan.small .lbl,.plan.tiny .lbl{align-items:center}
.plan.small .lbl .num{font-size:max(8px, calc(var(--u)*.62));color:var(--ink)}
.plan.tiny .lbl{padding:0}
.plan.tiny .lbl .np{display:none}
.plan.tiny .lbl .num{font-size:max(7px, calc(var(--u)*.95));color:var(--ink);letter-spacing:0}
.marquee{position:absolute;border:1.5px solid var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);pointer-events:none;z-index:8}

.legend{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface)}
.legend:empty{display:none}
.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:99px;background:transparent;font-size:13px;cursor:pointer}
.chipbtn:hover{border-color:var(--line-strong)}
.chipbtn .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--tc, var(--line-strong));flex:none}

/* Panel */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px 8px;border:0;background:transparent;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--f-mono);font-size:12px;font-weight:500;margin-left:4px}
.pbody{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.dnum{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:.9;letter-spacing:.01em;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.free{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mono{font-family:var(--f-mono);font-weight:600;background:var(--sheet);border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:6px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.l{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.input,select.input,textarea.input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-width:0}
textarea.input{min-height:76px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.mono{font-family:var(--f-mono);font-size:.92em}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card-top{display:flex;gap:12px;align-items:center;padding:14px;background:color-mix(in srgb, var(--tc, var(--line-strong)) 10%, var(--surface));border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--tc, var(--line-strong));color:var(--surface);flex:none}
.card-top .who{flex:1;min-width:0}
.card-top .nm{font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.card-top .tm{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.facts{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0}
.facts dt,.facts dd{padding:8px 14px;border-bottom:1px solid var(--line);margin:0}
.facts dt{font-size:12px;font-weight:600;color:var(--muted);padding-right:6px;white-space:nowrap}
.facts dd{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;overflow-wrap:anywhere;font-size:14px}
.facts dd .empty{color:var(--muted)}
.facts > :nth-last-child(-n+2){border-bottom:0}
.copy{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px;border-radius:5px;flex:none;display:grid;place-items:center}
.copy:hover{color:var(--accent);background:var(--accent-soft)}
.copy svg{width:15px;height:15px}
.notes{padding:12px 14px;border-top:1px solid var(--line);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.sm{font-size:13px}
.err{color:var(--danger);font-size:13px}
.empty-note{padding:14px;border:1px dashed var(--line-strong);border-radius:10px;color:var(--muted);font-size:14px}
.box{padding:12px;border-radius:10px;background:var(--sheet);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.confirm{padding:10px 12px;border-radius:8px;background:var(--danger-soft);display:flex;flex-direction:column;gap:8px;font-size:14px}
.nudge{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,36px);gap:4px;align-self:flex-start}
.nudge button{border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;font-size:16px;font-weight:700}
.nudge button:hover{border-color:var(--accent);color:var(--accent)}
.nudge span{display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.fieldrow{gap:8px}
.btn.ghost.danger{color:var(--danger)}
.maptable td{vertical-align:middle}
.maptable select.input{min-width:180px;padding:5px 8px}
.maptable .ex{max-width:150px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.maptable .err,.maptable .hint{white-space:normal;max-width:220px;margin-top:4px;font-size:12px}
.maptable .hint{color:var(--warn)}
@media (max-width: 560px){ .maptable .ex,.maptable th:nth-child(2){display:none} .maptable select.input{min-width:150px} }
.rowpreview{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:8px 10px;border-radius:7px;background:var(--surface);border:1px solid var(--line)}

.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li + li{border-top:1px solid var(--line)}
.prow{width:100%;display:flex;align-items:center;gap:10px;padding:9px 4px;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:6px}
.prow:hover{background:var(--accent-soft)}
.prow .avatar{width:32px;height:32px;font-size:14px;border-radius:8px}
.prow .who{flex:1;min-width:0}
.prow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ov{padding:10px;border:1px solid var(--line);border-radius:8px}
.ov b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.ov span{font-size:12px;color:var(--muted)}
.teamlist{display:flex;flex-direction:column;gap:4px}
.teamlist .chipbtn{justify-content:flex-start;border-radius:7px;width:100%;padding:6px 9px}
.teamlist .chipbtn .n{margin-left:auto}

.form{display:flex;flex-direction:column;gap:12px}
.form .f{display:flex;flex-direction:column;gap:4px}
.form .req{color:var(--danger)}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:-16px;background:var(--surface);padding-block:10px;margin-bottom:-6px;border-top:1px solid var(--line)}

/* Import sheet */
.overlay{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dialog{background:var(--surface);border-radius:12px;width:100%;max-width:700px;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px var(--shadow)}
.dialog h2{margin:0;font-family:var(--f-display);font-size:26px}
.dialog h3{margin:0;font-size:16px}
.dialog p{margin:0}
.drop{border:2px dashed var(--line-strong);border-radius:10px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.maplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;font-size:13px}
.maplist div{padding:6px 9px;border-radius:6px;background:var(--sheet);border:1px solid var(--line);min-width:0;overflow-wrap:anywhere}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}

.sumrow{display:flex;flex-wrap:wrap;gap:8px}
.impsec{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px}
.helpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:50;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;box-shadow:0 8px 24px var(--shadow);max-width:calc(100% - 32px)}

@media (max-width: 880px){
  html,body{height:auto}
  .app{height:auto}
  .work{grid-template-columns:1fr}
  .scroll{height:auto;flex:none;overflow-x:auto;overflow-y:hidden;overscroll-behavior:auto;overscroll-behavior-x:contain}

  .pbody{overflow:visible}
  .search{max-width:none;flex-basis:100%;order:3}
  .form-actions{bottom:0}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }

<body>
<div class="app">
  <header class="bar">

      <h1>Office Desk Map</h1>

    </div>
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Find a person, team, desk or computer tag" autocomplete="off" aria-label="Search">

    <div class="actions">
      <button class="btn" id="arrangeBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9 2 12l3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
        <span>Arrange desks</span>
      </button>
      <button class="btn" data-act="openData">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Data
      </button>
      <button class="btn" id="importBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>

  <div class="notices" id="notices"></div>

        <button role="tab" id="tabDesk" aria-selected="true" data-tab="desk">Desk</button>
        <button role="tab" id="tabPeople" aria-selected="false" data-tab="people">People<span class="n" id="peopleCount"></span></button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </main>
</div>

<div class="overlay" id="importOverlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="impTitle" id="importDialog"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const U_BASE = 22;
const ZOOMS = [0.25, 0.35, 0.5, 0.6, 0.75, 0.9, 1, 1.15, 1.3, 1.5, 1.75];
const SHAPES = {
  h: { w: 4, h: 2, label: 'Horizontal' },
  v: { w: 2, h: 4, label: 'Vertical' },
  corner: { w: 4, h: 4, label: 'Corner' }
};
/* People fields. Each map keeps its own editable copy (the Fields screen); this is the starting set. */
const KINDS = { text: 'Text', code: 'ID or code', email: 'Email', date: 'Date', long: 'Long text' };
function kindOf(f){ return f.textarea ? 'long' : f.type === 'date' ? 'date' : f.type === 'email' ? 'email' : f.mono ? 'code' : 'text'; }
function makeField(k, label, kind, extra = {}){
  const o = { k, label, aliases: extra.aliases || [] };
  if (extra.req) o.req = true;
  if (extra.match) o.match = true;
  if (kind === 'code') { o.mono = true; o.copy = true; }
  else if (kind === 'email') { o.type = 'email'; o.copy = true; }
  else if (kind === 'date') o.type = 'date';
  else if (kind === 'long') o.textarea = true;
  else if (k !== 'name') o.list = true;
  return o;
}
const DEFAULT_FIELDS = [
  makeField('name', 'Full name', 'text', { req: true, match: true, aliases: ['Name', 'Employee name', 'Employee', 'Person', 'Nombre', 'Nombre completo', 'Colaborador'] }),
  makeField('employeeId', 'Employee ID', 'code', { match: true, aliases: ['ID', 'Emp ID', 'Employee number', 'Employee no', 'Staff ID', 'Badge', 'Badge ID', 'ID empleado', 'Numero empleado', 'Cedula'] }),
  makeField('customerId', 'Customer ID', 'code', { match: true, aliases: ['Client ID', 'ID cliente', 'Customer number', 'Client number', 'Customer employee ID', 'Client employee ID', 'Account ID'] }),
  makeField('email', 'Email', 'email', { match: true, aliases: ['Email address', 'Mail', 'Work email', 'Correo', 'Correo electronico'] }),
  makeField('team', 'Team', 'text', { aliases: ['Department', 'Dept', 'Area', 'Equipo', 'Departamento'] }),
  makeField('supervisor', 'Supervisor', 'text', { aliases: ['Manager', 'Reports to', 'Jefe'] }),
  makeField('companyTeamLead', 'Company team lead', 'text', { aliases: ['Team lead', 'Company lead', 'TL', 'Lider', 'Lider de equipo'] }),
  makeField('customerTeamLead', 'Customer team lead', 'text', { aliases: ['Client team lead', 'Customer lead', 'Client lead', 'Lider cliente'] }),
  makeField('customerSupervisor', 'Customer supervisor', 'text', { aliases: ['Client supervisor', 'Supervisor cliente'] }),
  makeField('computerTag', 'Computer tag', 'code', { aliases: ['Asset tag', 'PC tag', 'Computer', 'Laptop tag', 'Laptop', 'Tag', 'Computer ID', 'Equipo computo', 'Serial', 'Hostname'] }),
  makeField('startDate', 'Start date', 'date', { aliases: ['Start', 'Hire date', 'Date started', 'Join date', 'Fecha ingreso', 'Fecha de ingreso'] }),
  makeField('notes', 'Notes', 'long', { aliases: ['Note', 'Comments', 'Comment', 'Notas', 'Observaciones'] })
];
function fields(){ const d = state.settings.get('fields'); return d && Array.isArray(d.fields) && d.fields.some(f => f.k === 'name') ? d.fields : DEFAULT_FIELDS; }
function fieldNames(f){ return [f.label, ...(f.aliases || [])].map(norm).filter(Boolean); }
function saveFields(list){ setRec('settings', { id: 'fields', fields: JSON.parse(JSON.stringify(list)) }); }
const NAME_PART_ALIASES = { firstName: ['firstname', 'first', 'givenname', 'nombres'], lastName: ['lastname', 'last', 'surname', 'familyname', 'apellido', 'apellidos'] };
const DESK_ALIASES = ['desk', 'desknumber', 'deskno', 'table', 'tablenumber', 'seat', 'seatnumber', 'puesto', 'escritorio', 'mesa'];
const LAYOUT_ALIASES = {
  desk: DESK_ALIASES,
  shape: ['shape','type','desktype','forma','tipo'],
  col: ['column','col','x','columna','left'],
  row: ['row','y','fila','top'],
  rot: ['rotation','rot','angle','rotacion','orientation']
};
const AREA_ALIASES = {
  area: ['area','zone','zona','areaname','zonename','name','nombre'],
  col: LAYOUT_ALIASES.col, row: LAYOUT_ALIASES.row,
  w: ['width','w','ancho','columns'],
  h: ['height','h','alto','rows']
};

/* ---------- state ---------- */
const state = {
  desks: new Map(), people: new Map(), zones: new Map(), settings: new Map(), fieldsDraft: null,
  loaded: false, local: false, readOnly: false,
  sel: new Set(), selectedZone: null, selectedPerson: null,
  tab: 'desk', arrange: false, multi: false, query: '',
  zoom: window.innerWidth < 880 ? 0.6 : 1,
  editing: null,      // {id, deskId}: person form
  panelMode: null,    // 'addRow'
  confirm: null,
  didFit: false
};
let downloads = true, drag = null, placing = null, renderPending = false, forcePanelNext = false, needsRenderAfterDrag = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'').slice(0,14) : Math.random().toString(36).slice(2,16));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const byNumber = (a, b) => String(a.number).localeCompare(String(b.number), undefined, { numeric: true });
const deskEl = id => planEl.querySelector(`.desk[data-id="${CSS.escape(id)}"]`);

/* ---------- derived helpers ---------- */
function desksArr(){ return [...state.desks.values()]; }
function peopleArr(){ return [...state.people.values()].sort((a,b) => (a.name||'').localeCompare(b.name||'')); }
function single(){ return state.sel.size === 1 ? state.sel.values().next().value : null; }
function seatIndex(){
  const m = new Map();
  for (const d of state.desks.values()) if (d.personId && state.people.has(d.personId)) m.set(d.personId, d);
  return m;
}
function teams(){
  const m = new Map();
  for (const p of state.people.values()) { const t = (p.team||'').trim(); if (t) m.set(t, (m.get(t)||0)+1); }
  return [...m.entries()].sort((a,b) => a[0].localeCompare(b[0]));
}
let teamColorCache = new Map();
function rebuildTeamColors(){ teamColorCache = new Map(teams().map(([t], i) => [t.toLowerCase(), i % 8])); }
function teamVar(team){
  const i = teamColorCache.get((team||'').trim().toLowerCase());
  return i === undefined ? 'var(--line-strong)' : `var(--t${i})`;
}
function initials(name){
  const parts = String(name||'?').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return ((parts[0][0]||'') + (parts.length > 1 ? parts[parts.length-1][0] : '')).toUpperCase();
}
function shortName(name){
  const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
  if (parts.length < 2) return parts[0] || '';
  return parts[0] + ' ' + parts[parts.length-1][0] + '.';
}
function inShape(shape, rot, c, r){
  if (shape !== 'corner') return true;
  switch (rot) {
    case 90: return r < 2 || c >= 2;
    case 180: return r >= 2 || c >= 2;
    case 270: return r >= 2 || c < 2;
    default: return r < 2 || c < 2;
  }
}
function cellsOf(shape, rot, x, y){
  const s = SHAPES[shape] || SHAPES.h, out = [];
  for (let r = 0; r < s.h; r++) for (let c = 0; c < s.w; c++) if (inShape(shape, rot, c, r)) out.push((x+c) + ',' + (y+r));
  return out;
}
function occupancy(exclude){
  const occ = new Set();
  for (const d of state.desks.values()) if (!exclude || !exclude.has(d.id)) for (const c of cellsOf(d.shape, d.rot||0, d.x, d.y)) occ.add(c);
  return occ;
}
function collides(id, shape, rot, x, y, occ){
  if (x < 0 || y < 0) return true;
  occ = occ || occupancy(new Set(id ? [id] : []));
  return cellsOf(shape, rot, x, y).some(c => occ.has(c));
}
function extent(){
  let maxX = 0, maxY = 0;
  for (const d of state.desks.values()) { const s = SHAPES[d.shape] || SHAPES.h; maxX = Math.max(maxX, d.x + s.w); maxY = Math.max(maxY, d.y + s.h); }
  for (const z of state.zones.values()) { maxX = Math.max(maxX, z.x + z.w); maxY = Math.max(maxY, z.y + z.h); }
  return { maxX, maxY };
}
// first top-left spot where a w×h box (plus a 1-square margin) is empty
function findBox(w, h){
  const occ = occupancy();
  const { maxX, maxY } = extent();
  const limitX = Math.max(maxX, w + 2, 30);
  for (let y = 1; y <= maxY + 2; y++) {
    for (let x = 1; x + w <= limitX + 1; x++) {
      let ok = true;
      for (let yy = y - 1; yy <= y + h && ok; yy++) for (let xx = x - 1; xx <= x + w; xx++) if (occ.has(xx + ',' + yy)) { ok = false; break; }
      if (ok) return { x, y };
    }
  }
  return { x: 1, y: maxY + 2 };
}
function deskNumParts(num){ const m = String(num||'').match(/^(.*?)(\d+)$/); return m ? { pre: m[1], n: parseInt(m[2],10), pad: m[2].length } : null; }
function nextDeskNumber(){
  let pre = '', pad = 1, max = 0;
  for (const d of state.desks.values()) {
    const p = deskNumParts(d.number);
    if (p && p.n >= max) { max = p.n; pre = p.pre; pad = p.pad; }
  }
  return pre + String(max + 1).padStart(Math.max(pad, String(max + 1).length), '0');
}
function numberSeq(start, count){
  const p = deskNumParts(start);
  if (!p) return null;
  const out = [];
  for (let i = 0; i < count; i++) out.push(p.pre + String(p.n + i).padStart(p.pad, '0'));
  return out;
}
function personMatches(p, q){
  return fields().some(f => p[f.k] && String(p[f.k]).toLowerCase().includes(q));
}
function connectedDesks(startId){
  const cellMap = new Map();
  for (const d of state.desks.values()) for (const c of cellsOf(d.shape, d.rot||0, d.x, d.y)) cellMap.set(c, d.id);
  const seen = new Set([startId]), queue = [startId];
  while (queue.length) {
    const d = state.desks.get(queue.shift());
    for (const c of cellsOf(d.shape, d.rot||0, d.x, d.y)) {
      const [x, y] = c.split(',').map(Number);
      for (const [nx, ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]) {
        const o = cellMap.get(nx + ',' + ny);
        if (o && !seen.has(o)) { seen.add(o); queue.push(o); }
      }
    }
  }
  return seen;
}

/* ---------- storage ---------- */
const writing = new Map();
let active = 0; const waiters = [];
async function gate(fn){
  if (active >= 6) await new Promise(r => waiters.push(r));
  active++;
  try { return await fn(); } finally { active--; const w = waiters.shift(); if (w) w(); }
}
const COLS = { desks: () => state.desks, people: () => state.people, zones: () => state.zones, settings: () => state.settings };
function setRec(col, rec){ COLS[col]().set(rec.id, rec); sync(col, rec.id); }
function patchRec(col, id, patch){ const m = COLS[col](); const cur = m.get(id); if (!cur) return; m.set(id, { ...cur, ...patch }); sync(col, id); }
function delRec(col, id){ COLS[col]().delete(id); sync(col, id); }

/* ---------- seat operations ---------- */
function seat(deskId, personId){
  const d = state.desks.get(deskId); if (!d) return;
  if (personId) {
    const from = seatIndex().get(personId);
    if (from && from.id !== deskId) patchRec('desks', from.id, { personId: null });
    const name = state.people.get(personId)?.name || 'Person';
    patchRec('desks', deskId, { personId });
    toast(from && from.id !== deskId ? `Moved ${name} from desk ${from.number} to desk ${d.number}` : `${name} is now at desk ${d.number}`);
  } else {
    patchRec('desks', deskId, { personId: null });
    toast(`Desk ${d.number} is now free`);
  }
  render(true);
}
function swapSeats(a, b){
  const da = state.desks.get(a), dbk = state.desks.get(b); if (!da || !dbk) return;
  patchRec('desks', a, { personId: dbk.personId || null });
  patchRec('desks', b, { personId: da.personId || null });
  toast(`Swapped desks ${da.number} and ${dbk.number}`);
  render(true);
}

/* ---------- rendering ---------- */
function render(forcePanel){
  if (forcePanel) forcePanelNext = true;
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => { renderPending = false; renderNow(); });
}
function renderNow(){
  if (drag || placing) { needsRenderAfterDrag = true; return; }
  rebuildTeamColors();
  for (const id of [...state.sel]) if (!state.desks.has(id)) state.sel.delete(id);
  if (state.selectedZone && !state.zones.has(state.selectedZone)) state.selectedZone = null;
  if (state.selectedPerson && !state.people.has(state.selectedPerson)) state.selectedPerson = null;
  const f = forcePanelNext; forcePanelNext = false;
  renderStats(); renderNotices(); renderTools(); renderPlan(); renderLegend(); renderPanel(f);
  if (state.loaded && !state.didFit) {
    state.didFit = true;
    const { maxX, maxY } = extent();
    const sc = $('#scroll');
    if (maxX && ((maxX + 2) * U_BASE * state.zoom > sc.clientWidth || (!narrow() && (maxY + 2) * U_BASE * state.zoom > sc.clientHeight))) fitToScreen();
  }
}

function renderStats(){
  const el = $('#stats');
  if (!state.loaded) { el.innerHTML = '<span>Loading…</span>'; return; }
  const ds = desksArr(), si = seatIndex();
  const seated = ds.filter(d => d.personId && state.people.has(d.personId)).length;
  const noDesk = state.people.size - si.size;
  el.innerHTML = `<span><b>${ds.length}</b> desks</span><span><b>${seated}</b> seated</span><span><b>${ds.length - seated}</b> free</span>`
    + (noDesk > 0 ? `<span class="warn"><b>${noDesk}</b> without a desk</span>` : '');
  $('#peopleCount').textContent = state.people.size ? state.people.size : '';
}

function renderNotices(){
  const out = [];
  if (state.loaded) out.push(storageNotices());
  const ex = [...state.people.values()].filter(p => p.example);
  if (ex.length && !state.readOnly) {
    if (state.confirm === 'clearExamples') {
      out.push(`<div class="notice"><p>Delete the ${ex.length} example people? Their desks stay on the map and become free.</p><div class="row"><button class="btn small danger solid" data-act="clearExamplesYes">Delete examples</button><button class="btn small" data-act="cancelConfirm">Cancel</button></div></div>`);
    } else {
      out.push(`<div class="notice"><p><b>Example data.</b> The ${ex.length} people on this map are made up so you can see how it works. Import your team list or clear them when you're ready.</p><div class="row"><button class="btn small primary" data-act="openImport">Import my list</button><button class="btn small" data-act="clearExamples">Clear examples</button></div></div>`);
    }
  }
  $('#notices').innerHTML = out.join('');
}

const ICON = {
  h: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="1.5"/></svg>',
  v: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="3" width="8" height="18" rx="1.5"/></svg>',
  corner: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v8h-10v10H3z"/></svg>',
  row: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/><rect x="16" y="9" width="6" height="6" rx="1"/></svg>',
  area: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/></svg>',
  multi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/><path d="M15 3h6v6M3 15v6h6"/></svg>',
  rotate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
};

function deskHTML(d, hits){
  const s = SHAPES[d.shape] || SHAPES.h;
  const rot = d.rot || 0;
  const p = d.personId ? state.people.get(d.personId) : null;
  const shape = d.shape === 'corner'
    ? `<path class="shape" d="M0.05 0.05H3.95V1.95H1.95V3.95H0.05Z" transform="rotate(${rot} 2 2)"/>`
    : `<rect class="shape" x="0.05" y="0.05" width="${s.w - .1}" height="${s.h - .1}" rx="0.2"/>`;
  const lblCls = d.shape === 'v' ? 'vert' : d.shape === 'corner' ? (rot === 180 || rot === 270 ? 'bottom' : 'top') : '';
  const isSel = state.sel.has(d.id);
  const cls = ['desk', p ? '' : 'free', isSel ? 'selected' : '', isSel && state.sel.size === 1 ? 'single' : '', hits && hits.has(d.id) ? 'hit' : ''].filter(Boolean).join(' ');
  const tc = p ? teamVar(p.team) : 'var(--line-strong)';
  const label = `Desk ${d.number}${p ? ', ' + p.name : ', free'}`;
  return `<div class="${cls}" data-id="${esc(d.id)}" role="button" tabindex="0" aria-label="${esc(label)}" title="${esc(label)}" aria-pressed="${isSel}"
    style="--x:${d.x};--y:${d.y};--w:${s.w};--h:${s.h};--tc:${tc}">
    <svg viewBox="0 0 ${s.w} ${s.h}" preserveAspectRatio="none" aria-hidden="true">${shape}</svg>
    <div class="lbl ${lblCls}">${numHTML(d.number)}<span class="nm">${p ? esc(shortName(p.name)) : 'Free'}</span></div>
  </div>`;
}
// any letters before the number are wrapped so they can be dropped when zoomed far out
function numHTML(number){
  const p = deskNumParts(number);
  if (!p) return `<span class="num">${esc(number)}</span>`;
  const digits = String(number).slice(p.pre.length);
  return `<span class="num">${p.pre ? `<span class="np">${esc(p.pre)}</span>` : ''}${esc(digits)}</span>`;
}
function zoneStyle(z){ return `--x:${z.x};--y:${z.y};--w:${z.w};--h:${z.h}`; }
function zoneFillHTML(z){
  return `<div class="zone ${state.selectedZone === z.id ? 'selected' : ''}" data-zid="${esc(z.id)}" style="${zoneStyle(z)}"></div>`;
}
function zoneTopHTML(z){
  const sel = state.selectedZone === z.id;
  return `<div class="zone-top ${sel ? 'selected' : ''}" data-zid="${esc(z.id)}" style="${zoneStyle(z)}">
    <button class="zlabel" data-zid="${esc(z.id)}" ${state.arrange ? '' : 'tabindex="-1"'} aria-label="Area ${esc(z.name)}">${esc(z.name || 'Area')}</button>
    ${state.arrange && sel ? `<span class="zhandle" data-zh="${esc(z.id)}" aria-hidden="true"></span>` : ''}
  </div>`;
}

const planEl = $('#plan');
function renderPlan(){
  planEl.style.setProperty('--u', (U_BASE * state.zoom) + 'px');
  planEl.classList.toggle('arrange', state.arrange);
  planEl.classList.toggle('tiny', state.zoom < 0.45);
  planEl.classList.toggle('small', state.zoom >= 0.45 && state.zoom < 0.7);
  const ds = desksArr();
  const { maxX, maxY } = extent();
  let cols = Math.max(36, maxX + 4), rows = Math.max(22, maxY + 4);
  if (state.arrange) { cols += 6; rows += 6; }
  planEl.style.width = `calc(${cols} * var(--u))`;
  planEl.style.height = `calc(${rows} * var(--u))`;
  planEl.dataset.cols = cols; planEl.dataset.rows = rows;
  if (!state.loaded) { planEl.innerHTML = `<div class="plan-msg"><p>Loading desk map…</p></div>`; return; }
  if (!ds.length && !state.zones.size) {
    planEl.classList.remove('searching');
    planEl.innerHTML = `<div class="plan-msg"><h2>No desks yet</h2>
      <p>Open your desk-map-data.json, build the floor row by row, import a layout from Excel, or start from a small starter layout.</p>
      <div class="row2">${state.readOnly ? '' : `<button class="btn primary" data-act="addRow">${ICON.row}Add a row of desks</button><button class="btn" data-act="openData">Open a data file</button><button class="btn" data-act="openImport">Import from Excel</button><button class="btn" data-act="starter">Starter layout</button>`}</div></div>`;
    return;
  }
  const q = state.query.trim().toLowerCase();
  let hits = null;
  if (q) {
    hits = new Set();
    for (const d of ds) {
      const p = d.personId ? state.people.get(d.personId) : null;
      if (String(d.number).toLowerCase().includes(q) || (p && personMatches(p, q))) hits.add(d.id);
    }
  }
  planEl.classList.toggle('searching', !!q);
  const zs = [...state.zones.values()];
  planEl.innerHTML = zs.map(zoneFillHTML).join('')
    + ds.sort((a,b) => (a.y - b.y) || (a.x - b.x)).map(d => deskHTML(d, hits)).join('')
    + zs.map(zoneTopHTML).join('');
}

function renderLegend(){
  $('#legend').innerHTML = teams().map(([t, n]) => `<button class="chipbtn" data-act="filterTeam" data-team="${esc(t)}" style="--tc:${teamVar(t)}"><span class="dot"></span>${esc(t)}<span class="n">${n}</span></button>`).join('');
}

/* ---------- panel ---------- */
function renderPanel(force){
  const body = $('#pbody');
  if (!force) {
    // don't wipe what someone is typing when data refreshes underneath
    if ((state.editing || state.panelMode) && body.querySelector('form')) return;
    const ae = document.activeElement;
    if (ae && body.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  }
  $('#tabDesk').setAttribute('aria-selected', state.tab === 'desk');
  $('#tabPeople').setAttribute('aria-selected', state.tab === 'people');
  if (state.editing) { body.innerHTML = personFormHTML(); return; }
  if (state.panelMode === 'addRow') { body.innerHTML = addRowFormHTML(); updateRowPreview(); return; }
  if (state.panelMode === 'fields') { body.innerHTML = fieldsPanelHTML(); return; }
  if (!state.loaded) { body.innerHTML = '<p class="muted">Loading…</p>'; return; }
  if (state.tab === 'people') { body.innerHTML = peoplePanelHTML(); return; }
  if (state.selectedZone) { body.innerHTML = zonePanelHTML(); return; }
  if (state.sel.size > 1) { body.innerHTML = groupPanelHTML(); return; }
  body.innerHTML = state.sel.size === 1 ? deskPanelHTML() : overviewHTML();
}

function fmtDate(v){
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return v;
  return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
function factRows(p){
  return fields().filter(f => f.k !== 'name' && f.k !== 'team' && !f.textarea).map(f => {
    let v = p[f.k];
    if (f.type === 'date' && v) v = fmtDate(v);
    const val = v ? `<span class="${f.mono ? 'mono' : ''}">${esc(v)}</span>${f.copy ? `<button class="copy" data-act="copy" data-val="${esc(p[f.k])}" aria-label="Copy ${esc(f.label.toLowerCase())}" title="Copy">${ICON.copy}</button>` : ''}` : '<span class="empty">—</span>';
    return `<dt>${esc(f.label)}</dt><dd>${val}</dd>`;
  }).join('');
}
function personCardHTML(p){
  return `<div class="card" style="--tc:${teamVar(p.team)}">
    <div class="card-top"><div class="avatar">${esc(initials(p.name))}</div>
      <div class="who"><div class="nm">${esc(p.name)}</div><div class="tm">${p.team ? `<span class="dot"></span>${esc(p.team)}` : 'No team'}</div></div>
      ${state.readOnly ? '' : `<button class="btn small" data-act="editPerson" data-id="${esc(p.id)}">Edit</button>`}
    </div>
    <dl class="facts">${factRows(p)}</dl>
    ${fields().filter(f => f.textarea && p[f.k]).map(f => `<div class="notes"><div class="eyebrow">${esc(f.label)}</div>${esc(p[f.k])}</div>`).join('')}
  </div>`;
}
function personOptions(selectedId){
  const si = seatIndex();
  return peopleArr().map(p => {
    const at = si.get(p.id);
    return `<option value="${esc(p.id)}" ${p.id === selectedId ? 'selected' : ''}>${esc(p.name)}${at && p.id !== selectedId ? ` (at desk ${esc(at.number)})` : (!at ? ' — no desk' : '')}</option>`;
  }).join('');
}

function deskPanelHTML(){
  const d = state.desks.get(single());

  const p = d.personId ? state.people.get(d.personId) : null;

  let html = `<div class="dhead"><div class="stack" style="gap:4px"><span class="eyebrow">${esc(s.label)} desk</span><div class="dnum">${esc(d.number)}</div></div>

  if (state.arrange && !ro) {
    html += `<div class="box"><h3>Desk setup</h3>
      <div class="stack"><label class="l" for="deskNum">Desk number</label>
        <div class="row2"><input class="input mono" id="deskNum" value="${esc(d.number)}" style="flex:1"><button class="btn small" data-act="saveNum">Save</button></div></div>
      <div class="stack"><label class="l" for="deskShape">Shape</label>

}

function readRowForm(){

function rowLayout(o){
  // relative positions of each desk in the block
  const s = SHAPES[o.shape];

  const out = [];
  for (let line = 0; line < lines; line++) for (let i = 0; i < o.count; i++) {

  }
  const w = o.dir === 'lr' ? o.count * s.w + (o.count - 1) * o.gap : lines * s.w;
  const h = o.dir === 'lr' ? lines * s.h : o.count * s.h + (o.count - 1) * o.gap;
  return { cells: out, w, h };
}

function addRow(){
  const o = readRowForm();

  const { cells, w, h } = rowLayout(o);

function moveSelection(dx, dy){

function renumberDesks(list, start, order){
  const sorted = [...list].sort(order === 'tb' ? (a,b) => (a.x - b.x) || (a.y - b.y) : (a,b) => (a.y - b.y) || (a.x - b.x));
  const nums = numberSeq(start, sorted.length);
  if (!nums) return 'The first number needs to be a number, like 101.';
  const ids = new Set(sorted.map(d => d.id));
  const used = new Set(desksArr().filter(d => !ids.has(d.id)).map(d => norm(d.number)));
  const clash = nums.find(n => used.has(norm(n)));
  if (clash) return `${clash} is already used by a desk outside the selection.`;
  sorted.forEach((d, i) => { if (d.number !== nums[i]) patchRec('desks', d.id, { number: nums[i] }); });

/* zoom */
const narrow = () => window.matchMedia('(max-width: 880px)').matches;
function setZoom(z){
  const sc = $('#scroll');
  const old = state.zoom;
  z = clamp(z, 0.2, 1.75);
  const cx = sc.scrollLeft + sc.clientWidth / 2, cy = sc.scrollTop + sc.clientHeight / 2;
  state.zoom = z;
  renderTools(); renderPlan();
  const r = z / old;
  sc.scrollLeft = cx * r - sc.clientWidth / 2;
  if (!narrow()) sc.scrollTop = cy * r - sc.clientHeight / 2;
}
function fitToScreen(){
  const sc = $('#scroll');
  const { maxX, maxY } = extent();
  if (!maxX) { setZoom(1); return; }
  // on phones the map grows down the page, so only its width needs to fit
  const zW = (sc.clientWidth - 24) / ((maxX + 2) * U_BASE);
  const z = narrow() ? zW : Math.min(zW, (sc.clientHeight - 24) / ((maxY + 2) * U_BASE));
  state.zoom = clamp(Math.floor(z * 100) / 100, 0.2, 1.5);
  renderTools(); renderPlan();
  sc.scrollTo({ left: 0, top: 0 });
}

document.addEventListener('click', e => {

  if (!b) return;
  const act = b.dataset.act;
  const one = single();
  switch (act) {
    case 'zoomIn': setZoom(ZOOMS.find(z => z > state.zoom + 0.001) ?? ZOOMS[ZOOMS.length - 1]); break;
    case 'zoomOut': setZoom([...ZOOMS].reverse().find(z => z < state.zoom - 0.001) ?? ZOOMS[0]); break;

/* ---------- DXF (AutoCAD R12 ASCII) ---------- */
// @@DXF-START
function dxfText(s){
  return String(s).replace(/[\r\n]+/g, ' ').replace(/[^\x20-\x7e]/g, ch => '\\U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0'));
}
function dxfShortName(name){
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length < 2) return parts[0] || '';
  return parts[0] + ' ' + parts[parts.length - 1][0] + '.';
}
function buildDXF(desks, zones, people, opts){
  const S = opts.squareMM;
  const out = [];
  const g = (code, val) => { out.push(String(code), String(val)); };
  const r3 = v => Math.round(v * 1000) / 1000;
  const P = (x, y) => [r3(x * S), r3(-y * S)]; // map grid (y down) to drawing (y up)
  const SIZE = { h: [4, 2], v: [2, 4], corner: [4, 4] };
  const layers = [['DESKS', 7], ['DESK-NUMBERS', 1], ['NAMES', 5], ['AREAS', 8], ['AREA-NAMES', 8]];

  g(0, 'SECTION'); g(2, 'HEADER');
  g(9, '$ACADVER'); g(1, 'AC1009');
  g(9, '$INSUNITS'); g(70, 4);
  g(0, 'ENDSEC');

  g(0, 'SECTION'); g(2, 'TABLES');
  g(0, 'TABLE'); g(2, 'LTYPE'); g(70, 1);
  g(0, 'LTYPE'); g(2, 'CONTINUOUS'); g(70, 0); g(3, 'Solid line'); g(72, 65); g(73, 0); g(40, 0);
  g(0, 'ENDTAB');
  g(0, 'TABLE'); g(2, 'LAYER'); g(70, layers.length);
  for (const [n, c] of layers) { g(0, 'LAYER'); g(2, n); g(70, 0); g(62, c); g(6, 'CONTINUOUS'); }
  g(0, 'ENDTAB');
  g(0, 'ENDSEC');

  g(0, 'SECTION'); g(2, 'ENTITIES');
  const poly = (layer, pts) => {
    g(0, 'POLYLINE'); g(8, layer); g(66, 1); g(10, 0); g(20, 0); g(30, 0); g(70, 1);
    for (const [x, y] of pts) { g(0, 'VERTEX'); g(8, layer); g(10, x); g(20, y); g(30, 0); }
    g(0, 'SEQEND'); g(8, layer);
  };
  // h: 0 left 1 centre; v: 1 bottom 2 middle 3 top
  const text = (layer, [x, y], height, str, rot = 0, h = 1, v = 2) => {
    if (!str) return;
    g(0, 'TEXT'); g(8, layer); g(10, x); g(20, y); g(30, 0); g(40, r3(height)); g(1, dxfText(str));
    if (rot) g(50, rot);
    g(72, h); g(11, x); g(21, y); g(31, 0); g(73, v);
  };

  for (const z of zones) {
    poly('AREAS', [P(z.x, z.y), P(z.x + z.w, z.y), P(z.x + z.w, z.y + z.h), P(z.x, z.y + z.h)]);
    text('AREA-NAMES', P(z.x + 0.4, z.y + 0.4), 0.6 * S, z.name || 'Area', 0, 0, 3);
  }

  for (const d of desks) {
    const shape = SIZE[d.shape] ? d.shape : 'h';
    const [w, h] = SIZE[shape];
    const rot = d.rot || 0;
    let pts;
    if (shape === 'corner') {
      const t = rot * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
      pts = [[0,0],[4,0],[4,2],[2,2],[2,4],[0,4]].map(([px, py]) => {
        const dx = px - 2, dy = py - 2;
        return P(d.x + r3(2 + dx * c - dy * s), d.y + r3(2 + dx * s + dy * c));
      });
    } else {
      pts = [P(d.x, d.y), P(d.x + w, d.y), P(d.x + w, d.y + h), P(d.x, d.y + h)];
    }
    poly('DESKS', pts);

    // label centre, matching where the map draws it
    let cx = d.x + w / 2, cy = d.y + h / 2;
    if (shape === 'corner') cy = d.y + (rot === 180 || rot === 270 ? 3 : 1);
    const p = d.personId && people.get(d.personId);
    const name = opts.names && p ? dxfShortName(p.name) : '';
    const nH = 0.38 * S, mH = 0.3 * S;
    if (shape === 'v') {
      // text runs bottom to top; the first line sits to the left
      text('DESK-NUMBERS', P(name ? cx - 0.3 : cx, cy), nH, d.number, 90);
      text('NAMES', P(cx + 0.35, cy), mH, name, 90);
    } else {
      text('DESK-NUMBERS', P(cx, name ? cy - 0.3 : cy), nH, d.number);
      text('NAMES', P(cx, cy + 0.35), mH, name);
    }
  }
  g(0, 'ENDSEC');
  g(0, 'EOF');
  return out.join('\r\n') + '\r\n';
}

/* ---------- zip (stored, no compression) ---------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes){ let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(10, time, true); lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(12, time, true); ch.setUint16(14, date, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
// @@DXF-END

/* ---------- standalone storage: this browser + an optional linked data file ---------- */
const LS_KEY = 'office-desk-map:v1';
const LS_META = 'office-desk-map:v1:fileSyncedAt';
const fsSupported = typeof window.showOpenFilePicker === 'function' && typeof window.showSaveFilePicker === 'function';
const store = { lsOk: true, handle: null, fileName: '', filePerm: 'none', fileError: null, saveTimer: null, saving: false, conflict: null, pending: null };

function sync(){
  clearTimeout(store.saveTimer);
  store.saving = true; renderSaveChip();
  store.saveTimer = setTimeout(saveNow, 300);
}
function snapshot(){
  const rows = m => [...m.values()].map(r => ({ ...r }));
  return { app: 'office-desk-map', version: 1, savedAt: new Date().toISOString(), desks: rows(state.desks), people: rows(state.people), zones: rows(state.zones), settings: rows(state.settings) };
}
function validSnapshot(d){ return d && Array.isArray(d.desks) && Array.isArray(d.people); }
function applySnapshot(d){
  if (!validSnapshot(d)) throw new Error('format');
  const m = arr => new Map((arr || []).filter(r => r && r.id != null).map(r => [String(r.id), { ...r, id: String(r.id) }]));
  state.desks = m(d.desks); state.people = m(d.people); state.zones = m(d.zones); state.settings = m(d.settings);
  state.sel = new Set(); state.selectedZone = null; state.selectedPerson = null; state.confirm = null; state.didFit = false; state.fieldsDraft = null; if (state.panelMode === 'fields') state.panelMode = null;
}
function lsGet(k){ try { return localStorage.getItem(k); } catch { store.lsOk = false; return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); store.lsOk = true; return true; } catch { store.lsOk = false; return false; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch {} }

async function saveNow(){
  clearTimeout(store.saveTimer); store.saveTimer = null;
  const snap = snapshot();
  lsSet(LS_KEY, JSON.stringify(snap));
  if (store.handle && store.filePerm === 'granted' && !store.conflict) {
    try {
      const w = await store.handle.createWritable();
      await w.write(JSON.stringify(snap, null, 2));
      await w.close();
      lsSet(LS_META, snap.savedAt);
      store.fileError = null;
    } catch (e) {
      store.fileError = 'write';
      try { store.filePerm = await store.handle.queryPermission({ mode: 'readwrite' }); } catch {}
    }
  }
  store.saving = false;
  renderSaveChip(); renderNotices();
}
// keep the browser copy when the tab closes mid-save
window.addEventListener('pagehide', () => { if (store.saveTimer) { clearTimeout(store.saveTimer); lsSet(LS_KEY, JSON.stringify(snapshot())); } });

/* the linked file handle is remembered between visits in IndexedDB */
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('office-desk-map', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kv(mode, key, val){
  const d = await idb();
  return new Promise((res, rej) => {
    const t = d.transaction('kv', mode === 'get' ? 'readonly' : 'readwrite'), s = t.objectStore('kv');
    const r = mode === 'get' ? s.get(key) : mode === 'del' ? s.delete(key) : s.put(val, key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}

async function readHandle(h){ const t = await (await h.getFile()).text(); return t.trim() ? JSON.parse(t) : null; }
function adoptFile(data){
  applySnapshot(data);
  lsSet(LS_KEY, JSON.stringify(data));
  if (data.savedAt) lsSet(LS_META, data.savedAt);
}
// decide which copy wins when a linked file is available
async function syncWithFile(local){
  let fileData;
  try { fileData = await readHandle(store.handle); }
  catch { store.fileError = 'read'; return; }
  if (fileData && !validSnapshot(fileData)) { store.fileError = 'format'; return; }
  const synced = lsGet(LS_META);
  if (!fileData) { await saveNow(); return; }
  if (!local) { adoptFile(fileData); return; }
  const localNew = !synced || (local.savedAt || '') > synced;
  const fileNew = !synced || (fileData.savedAt || '') > synced;
  if (localNew && fileNew && local.savedAt !== fileData.savedAt) { store.conflict = fileData; return; }
  if (localNew && !fileNew) await saveNow(); else adoptFile(fileData);
}
async function linkFile(create){
  if (!fsSupported) return;
  const types = [{ description: 'Desk map data', accept: { 'application/json': ['.json'] } }];
  let h;
  try { h = create ? await window.showSaveFilePicker({ suggestedName: 'desk-map-data.json', types }) : (await window.showOpenFilePicker({ types, multiple: false }))[0]; }
  catch { return; } // picker closed
  let perm = 'prompt';
  try { perm = await h.requestPermission({ mode: 'readwrite' }); } catch {}
  if (perm !== 'granted') { toast('The browser needs permission to write to that file. Try again and choose Allow.'); return; }
  if (!create) {
    let data;
    try { data = await readHandle(h); } catch { toast('That file could not be read.'); return; }
    if (data && !validSnapshot(data)) { toast("That file isn't a desk map data file."); return; }
    store.handle = h; store.fileName = h.name; store.filePerm = 'granted'; store.conflict = null; store.fileError = null;
    if (data) adoptFile(data); else await saveNow();
  } else {
    store.handle = h; store.fileName = h.name; store.filePerm = 'granted'; store.conflict = null; store.fileError = null;
    await saveNow();
  }
  try { await kv('put', 'handle', h); } catch {}
  closeImport(); render(true);
  requestAnimationFrame(() => requestAnimationFrame(fitToScreen));
  toast(create ? `Saving to ${h.name} from now on` : `Opened ${h.name}. Changes will be saved to it.`);
}
async function unlinkFile(){
  store.handle = null; store.fileName = ''; store.filePerm = 'none'; store.fileError = null; store.conflict = null;
  lsDel(LS_META);
  try { await kv('del', 'handle'); } catch {}

}
async function reconnectFile(){
  if (!store.handle) return;
  try { store.filePerm = await store.handle.requestPermission({ mode: 'readwrite' }); } catch { store.filePerm = 'prompt'; }
  if (store.filePerm !== 'granted') { toast('Permission not given. Changes are still saved in this browser.'); renderNotices(); return; }
  store.fileError = null;
  let local = null; try { local = JSON.parse(lsGet(LS_KEY) || 'null'); } catch {}
  await syncWithFile(local);
  render(true); renderSaveChip();
  if (!store.conflict && !store.fileError) toast(`Connected to ${store.fileName}`);
}

function renderSaveChip(){
  const el = document.getElementById('saveChip'); if (!el) return;
  let txt, cls = '';
  if (store.handle && store.filePerm === 'granted' && !store.fileError && !store.conflict) txt = store.saving ? `Saving to ${store.fileName}…` : `Saved to ${store.fileName}`;
  else if (store.handle) { txt = `Not connected to ${store.fileName}`; cls = 'warn'; }
  else if (!store.lsOk) { txt = 'Not saved'; cls = 'warn'; }
  else txt = store.saving ? 'Saving…' : 'Saved in this browser';

}
function storageNotices(){
  const out = [];
  if (store.conflict) {
    const f = store.conflict;
    out.push(`<div class="notice"><p><b>${esc(store.fileName)} changed somewhere else</b> (saved ${esc(fmtStamp(f.savedAt))}), and this browser also has changes that aren't in the file. Which version do you want to keep?</p><div class="row"><button class="btn small primary" data-act="useFile">Use the file (${f.desks.length} desks, ${f.people.length} people)</button><button class="btn small" data-act="keepLocal">Keep this browser's version</button></div></div>`);
  } else if (store.handle && (store.filePerm !== 'granted' || store.fileError === 'write')) {
    out.push(`<div class="notice"><p>This map saves to <b>${esc(store.fileName)}</b>, but the browser needs your OK again before it can write to it. Until then, changes are kept in this browser.</p><div class="row"><button class="btn small primary" data-act="reconnectFile">Reconnect</button></div></div>`);
  } else if (store.fileError === 'read' || store.fileError === 'format') {
    out.push(`<div class="notice"><p><b>${esc(store.fileName)}</b> couldn't be read${store.fileError === 'format' ? " because it isn't a desk map data file" : ''}, so it may have been moved or renamed. Changes are kept in this browser.</p><div class="row"><button class="btn small" data-act="openData">Choose the file again</button></div></div>`);
  }
  if (!store.lsOk && !(store.handle && store.filePerm === 'granted')) {
    out.push(`<div class="notice"><p>This browser isn't letting the page save, so changes last only until you close it. Link a data file or download a backup from Data to keep them.</p><div class="row"><button class="btn small" data-act="openData">Open Data</button></div></div>`);
  }

}

      ${served ? `<div class="row2"><button class="btn small ghost" data-data="fromSite">Reload desk-map-data.json from this site</button></div>` : ''}
      ${p ? `<div class="confirm"><span>Replace everything on the map with <b>${esc(p.name)}</b> (${p.data.desks.length} desks, ${p.data.people.length} people, ${(p.data.zones || []).length} areas${p.data.savedAt ? `, saved ${esc(fmtStamp(p.data.savedAt))}` : ''})?</span><div class="row2"><button class="btn small danger solid" data-data="replace">Replace the map</button><button class="btn small" data-data="cancelReplace">Cancel</button></div></div>` : ''}
    </div>
    <div class="row2"><span style="flex:1"></span><button class="btn" data-data="close">Close</button></div>`;
  $('#importOverlay').hidden = false;
  const fi = $('#backupFile');
  fi.addEventListener('change', async () => {
    const f = fi.files[0]; if (!f) return;
    try { const data = JSON.parse(await f.text()); if (!validSnapshot(data)) throw 0; store.pending = { name: f.name, data }; }
    catch { toast("That file isn't a desk map backup."); store.pending = null; }
    openData();
  });
  requestAnimationFrame(() => $('#impTitle')?.focus());
}
$('#importDialog').addEventListener('click', async e => {
  const b = e.target.closest('[data-data]'); if (!b) return;
  switch (b.dataset.data) {
    case 'close': store.pending = null; closeImport(); break;
    case 'create': linkFile(true); break;
    case 'open': linkFile(false); break;
    case 'unlink': unlinkFile(); break;
    case 'download': saveFile(`desk-map-backup-${new Date().toISOString().slice(0, 10)}.json`, new Blob([JSON.stringify(snapshot(), null, 2)], { type: 'application/json' })); break;
    case 'cancelReplace': store.pending = null; openData(); break;
    case 'replace': {
      const p = store.pending; store.pending = null;
      applySnapshot(p.data); await saveNow(); closeImport(); render(true);
      requestAnimationFrame(() => requestAnimationFrame(fitToScreen));
      toast(`Map replaced with ${p.name}`); break;
    }
    case 'fromSite': {
      try { const r = await fetch('desk-map-data.json', { cache: 'no-store' }); if (!r.ok) throw 0; const data = await r.json(); if (!validSnapshot(data)) throw 0; store.pending = { name: 'desk-map-data.json', data }; }
      catch { toast('No desk-map-data.json was found next to this page.'); }
      openData(); break;
    }
  }
});

/* ---------- startup ---------- */
async function init(){
  downloads = true;
  render();
  let local = null;
  try { local = JSON.parse(lsGet(LS_KEY) || 'null'); } catch { local = null; }
  if (local && validSnapshot(local)) applySnapshot(local); else local = null;
  if (fsSupported) {
    try {
      const h = await kv('get', 'handle');
      if (h) {
        store.handle = h; store.fileName = h.name;
        store.filePerm = await h.queryPermission({ mode: 'readwrite' });
        if (store.filePerm === 'granted') await syncWithFile(local);
      }
    } catch {}
  }
  // first visit: start from desk-map-data.json if it sits next to the page (served from a folder, repo or intranet)
  if (!local && !store.handle) {
    try { const r = await fetch('desk-map-data.json', { cache: 'no-store' }); if (r.ok) { const data = await r.json(); if (validSnapshot(data)) { applySnapshot(data); lsSet(LS_KEY, JSON.stringify(data)); } } } catch {}
  }
  state.loaded = true;
  render(true); renderSaveChip();
}
init();
})();
</script>
</body>
