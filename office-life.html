<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Office Life</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Same tokens as index.html, so the office looks like the map it's drawn from. */
:root{
  --paper:#eceff0; --sheet:#f7f9f9; --surface:#ffffff; --ink:#1a2529; --muted:#5b6a6f;
  --line:#d3dbdd; --line-strong:#9aa8ad; --grid:#e2e8ea; --grid-major:#d2dadd;
  --accent:#2453a6; --accent-ink:#ffffff; --accent-soft:#e3ebf8;
  --danger:#b23a2e; --danger-soft:#fbe9e6; --ok:#2c7650; --ok-soft:#e2f2e9; --warn:#8a5a00; --warn-soft:#fbf1dc;
  --shadow:rgba(20,35,45,.16); --scrim:rgba(18,26,30,.45);
  --t0:#c4561c; --t1:#2c7a4e; --t2:#7a49b3; --t3:#0e7b8a; --t4:#b52f6b; --t5:#8c6a0f; --t6:#3a5fc6; --t7:#5f7322;
  --coffee:#7a4a24; --night:#0b1a2e; --lamp:#ffd27a; --zombie:#6d8f57;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111719; --sheet:#161e21; --surface:#1d272b; --ink:#e4ecee; --muted:#9aabb0;
    --line:#2e3b40; --line-strong:#5d6f75; --grid:#1d272a; --grid-major:#263337;
    --accent:#7da4ec; --accent-ink:#0d1a30; --accent-soft:#1f2c44;
    --danger:#ee8577; --danger-soft:#3a201c; --ok:#6fcf9c; --ok-soft:#18302a; --warn:#e9b65a; --warn-soft:#33281a;
    --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6);
    --t0:#f08c52; --t1:#5fc48c; --t2:#b48ae8; --t3:#4cc2d0; --t4:#ec72a8; --t5:#d8b24b; --t6:#88a6f3; --t7:#a8bd5c;
    --coffee:#d7a374; --night:#02060c; --lamp:#ffcf6e; --zombie:#9cc485;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111719; --sheet:#161e21; --surface:#1d272b; --ink:#e4ecee; --muted:#9aabb0;
  --line:#2e3b40; --line-strong:#5d6f75; --grid:#1d272a; --grid-major:#263337;
  --accent:#7da4ec; --accent-ink:#0d1a30; --accent-soft:#1f2c44;
  --danger:#ee8577; --danger-soft:#3a201c; --ok:#6fcf9c; --ok-soft:#18302a; --warn:#e9b65a; --warn-soft:#33281a;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6);
  --t0:#f08c52; --t1:#5fc48c; --t2:#b48ae8; --t3:#4cc2d0; --t4:#ec72a8; --t5:#d8b24b; --t6:#88a6f3; --t7:#a8bd5c;
  --coffee:#d7a374; --night:#02060c; --lamp:#ffcf6e; --zombie:#9cc485;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%;gap:10px;padding:12px max(16px, env(safe-area-inset-left, 0px)) 16px max(16px, env(safe-area-inset-right, 0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0;max-width:100%}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;margin:0}
.brand .src{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{display:flex;align-items:baseline;gap:8px}
.clock .time{font-family:var(--f-mono);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.clock .day{font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--line-strong)}
.btn svg{width:16px;height:16px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:6px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;min-height:0}
.main.wide{grid-template-columns:minmax(0,1fr)}
.main.wide .side{display:none}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden;border-radius:10px}
canvas{display:block;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 12px -8px var(--shadow)}
.zoom button:hover{border-color:var(--line-strong)}
.zoom button svg{width:16px;height:16px}
.follow{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 20px);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-size:13.5px;box-shadow:0 6px 18px -10px var(--shadow)}
.follow .dot{grid-row:auto;flex:none}
.follow .what{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.follow b{white-space:nowrap}
.follow button{flex:none;border:0;background:var(--paper);border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:6px;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px -12px var(--shadow);padding:7px 10px;font-size:13.5px;line-height:1.35;max-width:240px;z-index:2}
.tip b{display:block;font-size:14.5px}
.tip .m{color:var(--muted)}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;margin:0 0 8px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;font-size:14px;line-height:1.3}
.dot{width:12px;height:12px;border-radius:50%;grid-row:span 2}
.list .m{color:var(--muted);font-size:12.5px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:1px 7px;border-radius:999px;background:var(--ok-soft);color:var(--ok);margin-left:4px;vertical-align:1px}
.chip.soon{background:var(--accent-soft);color:var(--accent)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px;line-height:1.35}
.log li{display:grid;grid-template-columns:46px 1fr;gap:6px}
.log li.empty{display:block}
.log li[data-i]{cursor:pointer;border-radius:4px}
.log li[data-i]:hover span{text-decoration:underline;text-underline-offset:2px}
.rooms li{cursor:default}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:1px}
.empty{color:var(--muted);font-size:13.5px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.note{font-size:13px;padding:7px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin:0}
.btn.small{padding:5px 10px;font-size:13px}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.panel p.m{color:var(--muted);font-size:13px;margin:0 0 8px}
.panel p.m:last-child{margin-bottom:0}
.panel .row{display:flex;flex-wrap:wrap;gap:6px}
.drills{display:flex;gap:6px;margin-bottom:8px}
.drills .btn{flex:1}
.big{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1;margin:0 0 6px}
/* the drill banner and the plan editor's bar, along the top of the map */
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:1;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 12px;width:max-content;max-width:calc(100% - 20px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 8px 7px 14px;box-shadow:0 8px 24px -12px var(--shadow);font-size:14px}
.banner b{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.1}
.banner .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.banner.col{flex-direction:column;align-items:stretch;padding:8px 10px;gap:6px}
.banner .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.banner .row b{margin-right:auto;padding-right:6px}
.banner .hint2{font-size:12.5px;color:var(--muted);max-width:520px;line-height:1.35}
.stage.drilling .follow{top:64px}
.stage::after{content:'';position:absolute;inset:0;border-radius:10px;pointer-events:none}
.stage.alarm-fire::after{animation:alarm 1s steps(1) infinite}
.stage.alarm-quake::after{animation:alarm-quake 1s steps(1) infinite}
.stage.shaking::after{animation:none;box-shadow:inset 0 0 0 5px var(--warn)}
@keyframes alarm{0%{box-shadow:inset 0 0 0 5px var(--danger)}50%{box-shadow:none}}
@keyframes alarm-quake{0%{box-shadow:inset 0 0 0 5px var(--warn)}50%{box-shadow:none}}
@media (prefers-reduced-motion: reduce){ .stage.alarm-fire::after{animation:none;box-shadow:inset 0 0 0 5px var(--danger)} .stage.alarm-quake::after{animation:none;box-shadow:inset 0 0 0 5px var(--warn)} }
.stage.editing canvas{cursor:default}
.stage.tool-zone canvas,.stage.tool-route canvas,.stage.pick canvas{cursor:crosshair}
.zlist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.zlist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.zlist li.sel{border-color:var(--accent);background:var(--accent-soft)}
.zlist li.empty{display:block;cursor:default;color:var(--muted);font-size:13.5px}
.zlist .dot{grid-row:auto}
.zlist input{font:inherit;font-weight:600;border:1px solid transparent;background:transparent;color:inherit;border-radius:5px;padding:2px 4px;margin-left:-4px;min-width:0;width:100%}
.zlist input:hover,.zlist input:focus{border-color:var(--line);background:var(--surface)}
.zlist .m{grid-column:2;color:var(--muted);font-size:12.5px;line-height:1.3}
.zlist .m.bad{color:var(--danger)}
.zlist .row{grid-column:2}
@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .stage{height:62vh;min-height:300px}
  .side{overflow:visible}
  .app{height:auto;min-height:100%}
}
@media (max-width:640px){ .brand{flex-basis:100%} .brand h1{font-size:24px} .brand .src{white-space:normal} .clock .time{font-size:20px} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Office Life</h1>
      <div class="src" id="src">Loading the map…</div>
    </div>
    <div class="clock" aria-live="off"><span class="time" id="time">--:--</span><span class="day" id="day"></span></div>
    <div class="actions">
      <div class="seg" role="group" aria-label="Clock">
        <button type="button" data-mode="live" title="Follow the real clock">Live</button>
        <button type="button" data-mode="fast" title="A whole working day in about four minutes">Fast day</button>
      </div>
      <button class="btn" id="playBtn" type="button" title="Pause (Space)" aria-label="Pause"></button>
      <button class="btn" id="followBtn" type="button" title="Follow someone who's in (R)">Follow someone</button>
      <button class="btn" id="sideBtn" type="button" title="Show or hide the side panel (H)">Panel</button>
      <button class="btn" id="fullBtn" type="button" title="Full screen (F)">Full screen</button>
      <button class="btn" id="openBtn" type="button">Open map…</button>
      <a class="btn" href="index.html">Desk map</a>
    </div>
  </header>
  <div class="main" id="main">
    <main class="stage" id="stage">
      <canvas id="cv" aria-label="The office floor plan with people moving around"></canvas>
      <div class="follow" id="follow" hidden></div>
      <div class="hint" id="hint">Click someone to follow them · scroll to zoom · drag to look around</div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <button type="button" id="zoomFit" title="Whole office (0)" aria-label="Show the whole office"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
        <button type="button" id="turnBtn" title="Turn the map 90° (T)" aria-label="Turn the map 90 degrees"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8.5A5.5 5.5 0 1 1 11 3.9"/><path d="M11.5 1.2v3.3H8.2"/></svg></button>
      </div>
      <div class="tip" id="tip" hidden></div>
      <div class="banner" id="drillbar" role="status" hidden></div>
      <div class="banner col" id="planbar" hidden>
        <div class="row"><b>Evacuation plan</b><button class="btn small" type="button" data-plan="zone">＋ Zone</button><button class="btn small" type="button" data-plan="finish">Finish route</button><button class="btn small solid" type="button" data-plan="done">Done</button></div>
        <div class="hint2" id="planHint"></div>
      </div>
    </main>
    <aside class="side">
      <section class="panel" id="annPanel"><h2>Anniversaries</h2><div id="ann"></div></section>
      <section class="panel"><h2>What’s happening</h2><ul class="log" id="log"></ul></section>
      <section class="panel" id="drillPanel"><h2>Emergency drills</h2><div id="drillBody"></div></section>
      <section class="panel" id="funPanel"><h2>Just for fun</h2><div id="funBody"></div></section>
      <section class="panel" id="planPanel" hidden>
        <h2>Evacuation plan</h2>
        <ul class="zlist" id="zlist"></ul>
        <div class="row" style="margin-bottom:8px"><button class="btn small" type="button" data-plan="export">Export plan</button><button class="btn small" type="button" data-plan="import">Import plan…</button></div>
        <p class="m" id="planNote"></p>
      </section>
      <section class="panel" id="roomPanel" hidden><h2>Meeting rooms</h2><ul class="list rooms" id="rooms"></ul></section>
      <section class="panel" id="teamPanel"><h2 id="teamTitle">Teams</h2><div class="legend" id="legend"></div></section>
    </aside>
  </div>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="planIn" accept=".json,application/json" hidden>
<script src="fun-map.js"></script>
<script>
'use strict';
const F = window.FunMap;
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

/* ---------- the clock ---------- */
// Live follows the real time. Fast day runs 07:00 to 20:00 in about four minutes, then starts the next day.
const DAY_START = 7 * 60, DAY_END = 20 * 60, FAST_RATE = (DAY_END - DAY_START) / 240; // sim minutes per real second
let mode = lsGet('office-life:mode') || (isWorkHours(new Date()) ? 'live' : 'fast');
let paused = false, simMin = 0, simDay = 0, fastClock = DAY_START + 60;
function isWorkHours(d){ const m = d.getHours() * 60 + d.getMinutes(), wd = d.getDay(); return wd > 0 && wd < 6 && m >= 8 * 60 && m < 18 * 60 + 30; }
const rate = () => mode === 'live' ? 1 / 60 : FAST_RATE;
const hhmm = m => { m = ((Math.floor(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const weekend = () => mode === 'live' && [0, 6].includes(new Date().getDay());
function tickClock(dt){
  if (mode === 'live') { const d = new Date(); simMin = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; simDay = Math.floor((d - new Date(2000, 0, 1)) / 864e5); return; }
  if (!paused && !drilling()) fastClock += dt * FAST_RATE; // a drill plays out in real seconds, so the day waits for it
  if (fastClock >= DAY_END) { fastClock = DAY_START; simDay++; newDay(); log('A new day begins'); }
  simMin = fastClock;
}

/* ---------- people ---------- */
let world = null, agents = [], rooms = [], roomAt = new Map(), pal, events = [], bits = [], annList = [], floorCells = [];
const WALK = { live: 1.7, fast: 2.6 };
const TRIPS = [['coffee', 34], ['chat', 30], ['stretch', 14], ['area', 10], ['meeting', 12]];

function setMap(data, src, fileName){
  world = F.build(data);
  $('#src').textContent = F.sourceLabel(src, fileName) + (world.hotDesking ? ' · people without a desk are borrowing free ones' : '');
  annList = F.anniversaries([...world.people.values()]);
  const ann = new Map(annList.map(a => [a.person, a]));
  agents = world.seated.map((s, i) => {
    const a = ann.get(s.person);
    return { i, person: s.person, desk: s.desk, seat: s.desk.seat, ci: world.colorIndex(s.person), team: world.groupOf(s.person),
      name: F.shortName(s.person.name) || 'Desk ' + s.desk.number, ini: F.initials(s.person.name || String(s.desk.number)),
      party: a && F.celebrating(a) ? a : null, x: 0, y: 0, state: 'out', path: null, then: null, until: 0, minReal: 0, what: '', emoji: '', with: null, room: null, phase: rand(0, 6),
      // the coffee machine nearest their desk
      coffee: world.coffees.reduce((b, c) => { const d = world.distance(s.desk.seat.cx, s.desk.seat.cy, c.spot[0], c.spot[1]); return d < b.d ? { c, d } : b; }, { c: world.coffee, d: Infinity }).c };
  });
  // meeting rooms: the free squares in each, the ones next to a table first
  roomAt = new Map();
  rooms = world.meetingZones.map(z => {
    const cells = world.zoneCells(z).filter(([x, y]) => !world.deskAtCell(x, y));
    const byTable = ([x, y]) => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => world.deskAtCell(x + dx, y + dy));
    const r = { name: z.name, table: cells.filter(byTable), rest: cells.filter(c => !byTable(c)), mtg: null };
    for (const [x, y] of cells) roomAt.set(x + ',' + y, r);
    return r;
  }).filter(r => r.table.length + r.rest.length >= 2);
  floorCells = [];
  for (let y = 0; y < world.rows; y++) for (let x = 0; x < world.cols; x++) if (world.indoors(x, y)) floorCells.push([x, y]);
  events = []; bits = []; drill = null; legCache.clear(); edit.draft = edit.handle = null;
  view.follow = null; view.zoom = view.zt = 1; view.cx = world.cols / 2; view.cy = world.rows / 2;
  newDay(true);
  layout(); renderSide(); stageClass(); renderDrill(); renderFun(); renderEditor();
}
// everyone's plan for the day, in minutes after midnight
function newDay(placeNow){
  for (const a of agents) {
    a.plan = { arrive: 8 * 60 + rand(-35, 70), leave: 17 * 60 + rand(-25, 85), lunch: 12 * 60 + rand(0, 70), lunchFor: rand(30, 55), lunchOut: Math.random() < 0.45 };
    a.lunched = false; a.next = a.plan.arrive + rand(15, 45);

    html = `<div class="drills"><button class="btn" type="button" data-drill="zombie"${ok ? '' : ' disabled'}>🧟 Zombie outbreak</button></div>`
      + '<p class="m">One person turns and nobody notices at first. People run when they see a zombie, and shut themselves in a room with a door if they can’t get out.</p>';
  }
  if (html === shownFun) return;
  shownFun = html;
  $('#funBody').innerHTML = html;
}
// doors people have shut themselves behind, shaking while the zombies bang on them
function drawDoorsShut(now){
  if (drill?.kind !== 'zombie' || !drill.rooms) return;
  for (const r of drill.rooms) {
    if (!r.shut) continue;
    const banging = drill.t - r.bang < 0.3, jx = banging ? Math.sin(now * 60) * 0.06 : 0;
    ctx.strokeStyle = pal.warn; ctx.lineWidth = 0.26; ctx.lineCap = 'butt';
    ctx.beginPath();
    for (const k of r.edges) {
      const [x, y] = k.slice(1).split(',').map(Number);
      if (k[0] === 'v') { ctx.moveTo(x + jx, y); ctx.lineTo(x + jx, y + 1); } else { ctx.moveTo(x, y + jx); ctx.lineTo(x + 1, y + jx); }
    }
    ctx.stroke();
    if (banging) { ctx.save(); upright(r.door[0], r.door[1]); ctx.font = `${Math.max(0.8, 15 / S)}px ${EMOJI}`; ctx.fillText('💥', r.door[0], r.door[1]); ctx.restore(); }
  }
}

/* the banner on the map and the panel at the side */
let shownBanner = null, shownDrill = null;
function renderBanner(){
  const d = drill;
  let html = '';
  if (d?.kind === 'zombie') html = outbreakBanner();
  else if (d?.phase === 'pick') html = '<b>🔥 Fire drill</b><span>Click where the fire starts</span><button class="btn small" type="button" data-drill="random">Somewhere random</button><button class="btn small" type="button" data-drill="cancel">Cancel</button>';
  else if (d) {
    const n = d.people.size, safe = drillCount('safe'), lost = drillCount('trapped');
    const title = d.phase === 'alert' ? '🚨 Earthquake alert' : d.phase === 'shake' ? '🌍 Earthquake' : d.phase === 'done' ? (lost ? `⚠️ ${safe} of ${n} out` : '✅ Everyone is out') : d.kind === 'fire' ? '🔥 Fire drill' : '🌍 Earthquake drill';
    const msg = d.phase === 'alert' ? `${safe} of ${n} out · shaking in ${Math.ceil(ALERT_FOR - d.t)} s`
      : d.phase === 'shake' ? `${d.caught ? 'Drop, cover and hold on · ' : ''}${safe} of ${n} out`
      : d.phase === 'done' ? `in ${mmss(d.doneAt)}${lost ? ` · ${lost} couldn’t get out` : ''}` : `${safe} of ${n} out${lost ? ` · ${lost} stuck` : ''}`;
    html = `<b>${title}</b><span>${msg}</span>${d.phase !== 'done' ? `<span class="t">${mmss(d.t)}</span>` : ''}<button class="btn small" type="button" data-drill="end">${d.phase === 'done' ? 'Back to work' : 'End drill'}</button>`;
  }
  if (html === shownBanner) return;
  shownBanner = html;
  $('#drillbar').innerHTML = html; $('#drillbar').hidden = !html;
}
function renderDrill(){
  if (!world) return;
  const d = drill?.kind === 'zombie' ? null : drill;
  let html;
  if (d?.phase === 'pick') html = '<p class="m">Click the map where the fire starts.</p><div class="row"><button class="btn small" type="button" data-drill="random">Somewhere random</button><button class="btn small" type="button" data-drill="cancel">Cancel</button></div>';
  else if (d) {
    const people = [...d.people], n = people.length, safe = drillCount('safe');
    const names = st => { const l = people.filter(a => a.state === st || st === 'inside' && a.state !== 'safe' && a.state !== 'trapped'); return l.length > 6 ? l.slice(0, 5).map(a => a.name).join(', ') + ` and ${l.length - 5} more` : l.map(a => a.name).join(', '); };
    const inside = names('inside'), cut = names('trapped');
    html = `<p class="big">${safe} of ${n} out · ${mmss(d.phase === 'done' ? d.doneAt : d.t)}</p>`
      + (inside ? `<p class="m">Still inside: ${esc(inside)}</p>` : '')
      + (cut ? `<p class="m" style="color:var(--danger)">Couldn’t get out: ${esc(cut)}</p>` : '')
      + `<button class="btn small" type="button" data-drill="end">${d.phase === 'done' ? 'Back to work' : 'End drill'}</button>`;
  } else {
    // an outbreak going on keeps the drills for later
    const inn = agents.some(a => a.state !== 'out') && !drill, zs = plan.zones, routed = zs.filter(z => z.route.length).length;
    html = `<div class="drills"><button class="btn" type="button" data-drill="quake"${inn ? '' : ' disabled'}>🌍 Earthquake</button><button class="btn" type="button" data-drill="fire"${inn ? '' : ' disabled'}>🔥 Fire</button></div>`
      + (inn || drill ? '' : '<p class="m">Nobody’s in right now. Try Fast day.</p>')
      + `<p class="m">${zs.length ? `${zs.length} evacuation zone${zs.length > 1 ? 's' : ''}, ${routed} with a route. Anyone outside them takes the nearest exit.` : 'No evacuation plan yet, so everyone takes the nearest exit.'}${planSrc === 'site' ? ' The plan is evacuation-plan.json from this site.' : ''}</p>`
      + '<button class="btn small" type="button" data-plan="open">Edit the evacuation plan</button>';
  }
  if (html === shownDrill) return;
  shownDrill = html;
  $('#drillBody').innerHTML = html;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-plan],[data-drill]');
  if (!b || b.disabled) return;
  const id = b.dataset.z;
  switch (b.dataset.plan || 'drill:' + b.dataset.drill) {
    case 'open': openEditor(); break;
    case 'done': closeEditor(); break;
    case 'zone': setTool(edit.tool === 'zone' ? null : 'zone'); break;
    case 'finish': finishRoute(); break;
    case 'route': setTool('route', id); break;
    case 'del': deleteZone(id); break;
    case 'export': exportPlan(); break;
    case 'import': $('#planIn').click(); break;
    case 'drill:quake': startDrill('quake'); break;
    case 'drill:fire': pickFire(); break;
    case 'drill:random': startDrill('fire', randomFireCell()); break;
    case 'drill:cancel': case 'drill:end': endDrill(); break;
    case 'drill:zombie': pickZero(); break;
    case 'drill:zero': startOutbreak(pick(agents.filter(a => !offMap(a)))); break;
  }
});

/* ---------- header ---------- */
let shownTime = '';
function renderClock(){
  const t = hhmm(simMin);
  if (t !== shownTime) {
    shownTime = t; $('#time').textContent = t;
    const inn = agents.filter(a => a.state !== 'out').length;
    $('#day').textContent = `${mode === 'live' ? new Date().toLocaleDateString(undefined, { weekday: 'long' }) : 'Day ' + (simDay + 1)} · ${inn} of ${agents.length} in`;
    renderRooms(); renderDrill(); renderFun();
  }
}
function renderControls(){
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  const pb = $('#playBtn');
  pb.innerHTML = paused ? '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>' : '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
  pb.setAttribute('aria-label', paused ? 'Play' : 'Pause'); pb.title = paused ? 'Play (Space)' : 'Pause (Space)';
}
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  if (mode === b.dataset.mode) return;
  mode = b.dataset.mode; lsSet('office-life:mode', mode);
  if (mode === 'fast') fastClock = clamp(simMin, DAY_START, DAY_END - 1);
  shownTime = ''; newDay(true); events = []; renderLog(); renderControls();
}));
$('#playBtn').addEventListener('click', () => { paused = !paused; renderControls(); });
const sideKey = 'office-life:side';
function setSide(show){ $('#main').classList.toggle('wide', !show); lsSet(sideKey, show ? '1' : '0'); requestAnimationFrame(layout); }
$('#sideBtn').addEventListener('click', () => setSide($('#main').classList.contains('wide')));
$('#fullBtn').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {}));
$('#openBtn').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { setMap(await F.readFile(f), 'file', f.name); } catch (err) { alert(err.message); }
});
addEventListener('keydown', e => {
  if (e.target.closest?.('input,textarea,select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (edit.on && editKey(e)) { e.preventDefault(); return; }
  if (drill?.phase === 'pick' && e.key === 'Escape') { endDrill(); return; }
  if (e.code === 'Space') {
    if (e.target.closest?.('button,a')) return; paused = !paused; renderControls(); e.preventDefault(); }
  else if (e.code === 'KeyF') $('#fullBtn').click();
  else if (e.code === 'KeyH') $('#sideBtn').click();
  else if (e.code === 'KeyR' && !edit.on) followSomeone();
  else if (e.code === 'KeyT') turnView();
  else if (e.code === 'Escape') follow(null);
  else if (e.key === '+' || e.key === '=') $('#zoomIn').click();
  else if (e.key === '-' || e.key === '_') $('#zoomOut').click();
  else if (e.key === '0') $('#zoomFit').click();
});

// who's under the pointer, if anyone
function personAt(e){
  const r = cv.getBoundingClientRect(), p = toWorld(e.clientX - r.left, e.clientY - r.top);
  let best = null, bd = Math.max(0.7, 14 / S);
  for (const a of agents) if (!offMap(a)) { const d = Math.hypot(a.x - p.x, a.y - p.y); if (d < bd) { bd = d; best = a; } }
  return best;
}
// hover a person to see who it is and what they're up to
function showTip(e){
  if (!world) return;
  const best = personAt(e), tip = $('#tip');
  if (!best) { tip.hidden = true; return; }
  const party = best.party ? `<div>🎈 ${best.party.years} year${best.party.years > 1 ? 's' : ''} here ${best.party.days === 0 ? 'today' : 'this week'}</div>` : '';
  tip.innerHTML = `<b>${esc(best.person.name || best.name)}</b><div class="m">${esc([best.team, 'desk ' + best.desk.number].filter(Boolean).join(' · '))}</div><div>${esc(best.what)}</div>${party}`;
  tip.hidden = false;
  const sr = $('#stage').getBoundingClientRect();
  const left = clamp(e.clientX - sr.left + 14, 4, sr.width - tip.offsetWidth - 4), top = clamp(e.clientY - sr.top + 14, 4, sr.height - tip.offsetHeight - 4);
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
// click someone to follow them, click the floor to stop; drag to look around; wheel or pinch to zoom
const touches = new Map();
let drag = null, pinch = null;
const pointerWorld = e => { const r = cv.getBoundingClientRect(); return toWorld(e.clientX - r.left, e.clientY - r.top); };
cv.addEventListener('pointerdown', e => {
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cv.setPointerCapture(e.pointerId);
  // editing the plan: drag out a zone, or grab a corner or a route point
  if (edit.on && touches.size === 1) {
    const p = pointerWorld(e);
    if (edit.tool === 'zone') { const x = Math.round(p.x), y = Math.round(p.y); edit.draft = { x0: x, y0: y, x1: x, y1: y }; return; }
    if (!edit.tool) { const h = handleAt(p); if (h) { edit.handle = h; return; } }
  }
  if (touches.size === 1) drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy, moved: false };
  else if (touches.size === 2) {
    const [p, q] = [...touches.values()];
    pinch = { d: Math.hypot(p.x - q.x, p.y - q.y), zoom: view.zoom }; drag = null; edit.draft = edit.handle = null;
  }
});
cv.addEventListener('pointermove', e => {
  if (edit.on && e.pointerType === 'mouse') {
    edit.hover = pointerWorld(e);
    if (!edit.tool && !touches.size) cv.style.cursor = handleAt(edit.hover) ? 'move' : '';
  }
  if (!touches.has(e.pointerId)) { if (e.pointerType === 'mouse' && !edit.on) showTip(e); return; }
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (edit.draft) { const p = pointerWorld(e); edit.draft.x1 = Math.round(p.x); edit.draft.y1 = Math.round(p.y); return; }
  if (edit.handle) { moveHandle(edit.handle, pointerWorld(e)); return; }
  if (pinch && touches.size === 2) {
    const [p, q] = [...touches.values()], r = cv.getBoundingClientRect();
    setZoom(pinch.zoom * Math.hypot(p.x - q.x, p.y - q.y) / pinch.d, (p.x + q.x) / 2 - r.left, (p.y + q.y) / 2 - r.top);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 5) { drag.moved = true; cv.classList.add('dragging'); $('#tip').hidden = true; if (view.follow) { follow(null); drag.cx = view.cx; drag.cy = view.cy; } }
    if (drag.moved) { const d = rot(dx / S, dy / S, -view.ang); view.cx = drag.cx - d.x; view.cy = drag.cy - d.y; clampView(); }
  }
});
function pointerEnd(e){
  if (!touches.has(e.pointerId)) return;
  touches.delete(e.pointerId);
  if (edit.draft) { if (e.type === 'pointerup') finishDraft(); else edit.draft = null; }
  else if (edit.handle) { edit.handle = null; savePlan(); renderEditor(); }
  else if (drag && !drag.moved && e.type === 'pointerup' && edit.on) editClick(pointerWorld(e));
  else if (drag && !drag.moved && e.type === 'pointerup' && drill?.phase === 'pick') {
    if (drill.kind === 'zombie') { const a = personAt(e); if (a) startOutbreak(a); }
    else startDrill('fire', fireCellAt(pointerWorld(e)));
  }
  else if (drag && !drag.moved && e.type === 'pointerup') {
    const a = personAt(e);
    follow(a && a !== view.follow ? a : null);
    if (a && e.pointerType !== 'mouse') showTip(e); else $('#tip').hidden = true;
  }
  drag = null; cv.classList.remove('dragging');
  if (touches.size < 2) pinch = null;
}
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { $('#tip').hidden = true; edit.hover = null; } });
cv.addEventListener('dblclick', () => { if (edit.on && edit.tool === 'route') finishRoute(); });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  setZoom(view.zoom * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
$('#zoomIn').addEventListener('click', () => { view.zt = clamp(view.zt * 1.5, 1, maxZoom()); });
$('#zoomOut').addEventListener('click', () => { view.zt = clamp(view.zt / 1.5, 1, maxZoom()); });
$('#zoomFit').addEventListener('click', () => { follow(null); view.zt = 1; });
$('#turnBtn').addEventListener('click', turnView);
$('#followBtn').addEventListener('click', followSomeone);
function followSomeone(){
  const inn = agents.filter(a => !offMap(a) && a !== view.follow);
  // someone up and about is more fun to watch than someone at their desk
  const busy = inn.filter(a => a.state !== 'seat');
  if (inn.length) follow(pick(busy.length && Math.random() < 0.8 ? busy : inn));
}
let shownFollow = '';
function renderFollow(){
  const a = view.follow, box = $('#follow');
  const key = a ? a.i + '|' + a.what : '';
  if (key === shownFollow) return;
  shownFollow = key;
  box.hidden = !a;
  if (a) box.innerHTML = `<span class="dot" style="background:${F.teamColor(pal, a.ci)}"></span><span>Following <b>${esc(a.name)}</b></span><span class="what">· ${esc(a.what)}</span><button type="button" aria-label="Stop following" title="Stop following (Esc)">×</button>`;
}
$('#follow').addEventListener('click', e => { if (e.target.closest('button')) follow(null); });

let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 80); });
document.addEventListener('fullscreenchange', () => setTimeout(layout, 50));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { layout(); renderSide(); });

let last = performance.now();
function frame(t){
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  if (world) {
    tickClock(dt);
    if (!paused) update(dt);
    moveCamera(dt);
    render(t / 1000);
    renderClock(); renderFollow();
    if (drill) { renderDrill(); renderBanner(); renderFun(); }
  }
  requestAnimationFrame(frame);
}

(async () => {
  if (lsGet(sideKey) === '0') $('#main').classList.add('wide');
  renderControls();
  const [{ data, source }] = await Promise.all([F.load(), loadPlan()]);
  try { await document.fonts.ready; } catch {}
  setMap(data, source);
  requestAnimationFrame(frame);
})();
</script>
